server:
  port: 8080

spring:
  application:
    name: myfinance
  datasource:
    url: jdbc:h2:file:./data/myfinance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# CORS configuration
app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: myfinance-jwt-secret-key-please-change-in-production-at-least-256-bits
    expiration: 86400000

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
