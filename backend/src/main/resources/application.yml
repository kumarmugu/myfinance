server:
  port: 8080

spring:
  application:
    name: myfinance
  datasource:
    url: jdbc:h2:file:./data/myfinance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      # Receipt image uploads for OCR scanning.
      max-file-size: 10MB
      max-request-size: 12MB

# CORS configuration
app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: myfinance-jwt-secret-key-please-change-in-production-at-least-256-bits
    expiration: 86400000
  # Internal provisioning API token (server-to-server, used by the SaaS backend).
  # Empty by default = provisioning endpoints are disabled (return 503).
  # Set via the PROVISIONING_TOKEN environment variable / secret store in real environments.
  provisioning:
    token: ${PROVISIONING_TOKEN:}
  # Local receipt OCR (Tesseract via Tess4J). Self-hosted — images never leave this server.
  # Empty tessdata-path = OCR disabled (scan endpoint returns 503). To enable, install
  # Tesseract + the language data and point tessdata-path at the directory holding the
  # *.traineddata files, e.g. TESSDATA_PATH=/opt/homebrew/share/tessdata (macOS) or
  # /usr/share/tesseract-ocr/5/tessdata (Linux).
  ocr:
    tessdata-path: ${TESSDATA_PATH:}
    language: ${OCR_LANGUAGE:eng}
  # Online market-price lookup for the Assets "Update Price" button.
  # provider: "stooq" (default, no API key) or "yahoo" (unofficial, broader coverage).
  # Prices are fetched server-side; unfetchable symbols (e.g. Sri Lanka/CSE) are left unchanged
  # so the user can maintain them manually. enabled=false disables the refresh endpoints (503).
  price:
    provider: ${PRICE_PROVIDER:stooq}
    enabled: ${PRICE_FETCH_ENABLED:true}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.myfinance: DEBUG
    org.springframework.web: INFO
  file:
    name: ./logs/myfinance.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
